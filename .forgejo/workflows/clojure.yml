name: Clojure CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: https://data.forgejo.org/actions/checkout@v6
    - name: Install clojure tools
      uses: https://git.dgknght.com/dgknght/setup-clojure@v1
      with:
        java-version: 21
        lein-version: 2.11.1
        clj-kondo-version: '2026.08.04'
    - name: Install dependencies
      run: lein deps
    - name: Run tests
      run: lein cloverage
